name: Bina APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Sedia kunci tetap
        env:
          KS_B64: ${{ secrets.JANG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Secret JANG_KEYSTORE_B64 tiada"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/jang.jks"
          echo "JANG_KEYSTORE_PATH=$RUNNER_TEMP/jang.jks" >> "$GITHUB_ENV"
      - name: Bina APK
        env:
          JANG_KEYSTORE_PASS: ${{ secrets.JANG_KEYSTORE_PASS }}
        run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk JangKaunter.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0
          name: Jang Kaunter APK v1.0
          body: "Muat turun JangKaunter.apk di tablet Android, buka fail, benarkan 'install dari sumber ini', Install."
          files: JangKaunter.apk
          make_latest: true
